<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BattleShip (WASM)</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; height: 100%; overflow: hidden; }
  html.is-embedded, html.is-embedded body, html.is-embedded body * { cursor: none !important; }
  html.is-embedded #boot, html.is-embedded #pad { display: none; }
  #wrap { display: flex; align-items: center; justify-content: center; height: 100%; }
  /* Hold the canvas element at 4:3 and letterbox inside the viewport;
   * SDL sizes the GL buffer to match the element, so the game renders at
   * the aspect the element has — a free-size canvas means a stretched game. */
  canvas {
    width: min(100vw, calc(100vh * 4 / 3));
    height: min(100vh, calc(100vw * 3 / 4));
    image-rendering: pixelated;
    outline: none;
  }
  #status {
    position: fixed; left: 12px; bottom: 10px; color: #9f9;
    font: 12px/1.4 ui-monospace, monospace; white-space: pre; pointer-events: none;
  }
  /* ---- matchup card (engine holds the battle while this shows) ---- */
  #matchup {
    position: fixed; inset: 0; z-index: 20; display: none;
    background:
      radial-gradient(ellipse at 50% 60%, rgba(140, 20, 10, .85) 0%, rgba(40, 6, 4, .95) 45%, #000 100%),
      #000;
    color: #fff; font-family: "Arial Black", "Helvetica Neue", Arial, sans-serif;
    user-select: none; cursor: default;
    opacity: 0; transition: opacity .25s ease;
  }
  #matchup.show { display: flex; align-items: center; justify-content: center; }
  #matchup.in { opacity: 1; }
  #matchup .row {
    display: flex; align-items: center; justify-content: center;
    gap: clamp(12px, 3vw, 48px); width: 100%; padding: 0 3vw; box-sizing: border-box;
  }
  #matchup .card {
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    width: min(28vw, 42vh); flex: 0 1 auto;
    opacity: 0; transform: translateX(var(--from, 0)) scale(.9);
    transition: opacity .35s ease, transform .45s cubic-bezier(.2, 1.4, .4, 1);
  }
  #matchup.in .card { opacity: 1; transform: none; }
  #matchup .art {
    width: 100%; aspect-ratio: 1; box-sizing: border-box;
    border: 4px solid var(--pc, #ddd); border-radius: 6px;
    background: #1a0806 center / cover no-repeat;
    box-shadow: 0 0 0 2px #000, 0 12px 40px rgba(0, 0, 0, .7), 0 0 60px rgba(255, 90, 40, .25);
    image-rendering: auto; display: flex; align-items: center; justify-content: center;
    overflow: hidden; position: relative;
  }
  #matchup .art.vanilla { background: linear-gradient(160deg, #3a3a3a, #101010); }
  #matchup .art.vanilla::before {
    content: attr(data-initial); font-size: min(14vw, 20vh); color: rgba(255,255,255,.18);
    line-height: 1;
  }
  #matchup .tag {
    position: absolute; left: 6px; top: 6px; padding: 2px 8px; border-radius: 3px;
    background: var(--pc, #ddd); color: #000; font-size: clamp(11px, 1.6vw, 18px);
    letter-spacing: .06em; box-shadow: 0 1px 0 #000;
  }
  #matchup .name {
    font-size: clamp(16px, 2.6vw, 38px); line-height: 1.1; text-align: center;
    letter-spacing: .04em; text-transform: uppercase; font-style: italic;
    color: #ffe98a;
    text-shadow: 0 0 2px #000, 2px 2px 0 #000, -2px 2px 0 #000, 2px -2px 0 #000, -2px -2px 0 #000,
                 0 6px 18px rgba(0,0,0,.8);
    max-width: 100%; overflow-wrap: anywhere;
  }
  #matchup .vs {
    font-size: clamp(28px, 6vw, 96px); font-style: italic; font-weight: 900; line-height: 1;
    color: #fff; flex: 0 0 auto;
    text-shadow: 0 0 3px #000, 3px 3px 0 #000, -3px 3px 0 #000, 3px -3px 0 #000, -3px -3px 0 #000,
                 0 0 40px rgba(255, 120, 40, .9);
    opacity: 0; transform: scale(2.2); transition: opacity .2s ease .25s, transform .35s cubic-bezier(.2, 1.6, .4, 1) .25s;
  }
  #matchup.in .vs { opacity: 1; transform: none; }
  #matchup .hint {
    position: absolute; bottom: 4vh; left: 0; right: 0; text-align: center;
    font: 12px/1.4 ui-monospace, monospace; color: rgba(255,255,255,.45); letter-spacing: .1em;
  }
  #matchup.compact .card { width: min(20vw, 34vh); }
  #matchup.compact .vs { font-size: clamp(20px, 4vw, 64px); }
</style>
<script>
// The merged site renders its hand cursor above this iframe. Relay pointer
// coordinates to the parent so the hand keeps tracking across the game, and
// hide the iframe's native cursor only when the engine is embedded.
if (window.parent !== window) {
  document.documentElement.classList.add('is-embedded');
  const pointerKinds = {
    pointermove: 'move',
    pointerdown: 'down',
    pointerup: 'up',
    pointercancel: 'cancel',
  };
  for (const [eventType, kind] of Object.entries(pointerKinds)) {
    window.addEventListener(eventType, (event) => {
      window.parent.postMessage({
        type: 'opensmash-game-pointer',
        kind,
        x: event.clientX,
        y: event.clientY,
        viewportWidth: window.innerWidth,
        viewportHeight: window.innerHeight,
      }, window.location.origin);
    }, { capture: true, passive: true });
  }
}
</script>

<body>
<div id="wrap"><canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas></div>
<div id="status">loading…</div>
<div id="matchup" aria-live="polite"><div class="row"></div><div class="hint">PRESS ANY BUTTON</div></div>
<script>
// Shared roster helpers. ROSTER_VARIANT: skeleton-variant name per fighter
// kind (index = fkind, '' = the mario-default bundle). rosterBaseFk: which
// fighter a character actually PLAYS as — resolution order:
//   URL ?base=slug:target,slug:target  (ad-hoc experiments)
//   > /roster.json "base"               (explicit metadata or balanced server assignment)
//   > the tile the character sits on    (legacy fallback)
// The tile only decides WHERE the character appears on the select screen;
// the base decides skeleton, moveset and which mesh variant is staged.
window.ROSTER_VARIANT = ['', 'fox', 'donkey', 'samus', 'luigi', 'link',
                         'yoshi', 'captain', 'kirby', 'pikachu', 'purin', 'ness'];
window.rosterBaseFk = (c, tileFk) => {
  const V = window.ROSTER_VARIANT;
  const alias = { mario: '', donkeykong: 'donkey', dk: 'donkey',
                  jigglypuff: 'purin', falcon: 'captain', captainfalcon: 'captain' };
  let name = null;
  for (const kv of (new URLSearchParams(location.search).get('base') || '').split(',')) {
    const [s, t] = kv.split(':');
    if (s === c.slug && t) name = t;
  }
  name = name ?? c.base ?? V[tileFk];
  name = alias[name] ?? name;
  let fk = name === '' ? 0 : V.indexOf(name);
  if (fk < 0) { console.warn(`roster: unknown base '${name}' for ${c.slug}`); fk = tileFk; }
  return fk;
};
// stageable = the character's resolved base variant bundle exists
window.rosterStageable = (c, tileFk) => {
  const fk = window.rosterBaseFk(c, tileFk);
  return fk === 0 || (c.variants || []).includes(window.ROSTER_VARIANT[fk]);
};
</script>
<script>
// Capture runs need readable canvas contents at arbitrary points; SDL
// creates the GL context with preserveDrawingBuffer=false, so patch
// getContext before the engine loads. Gated to ?capture= runs only.
if (new URLSearchParams(location.search).has('capture')) {
  const _gc = HTMLCanvasElement.prototype.getContext;
  HTMLCanvasElement.prototype.getContext = function (type, attrs) {
    if (typeof type === 'string' && type.indexOf('webgl') === 0) {
      attrs = Object.assign({}, attrs || {}, { preserveDrawingBuffer: true });
    }
    return _gc.call(this, type, attrs);
  };
}
</script>
<script>
window.__lastError = null;
window.addEventListener('unhandledrejection', (e) => {
  window.__lastError = (e.reason && e.reason.stack) ? String(e.reason.stack) : String(e.reason);
});
window.addEventListener('error', (e) => {
  if (e.error && e.error.stack) window.__lastError = String(e.error.stack);
});
const statusEl = document.getElementById('status');
const setStatus = (t) => { statusEl.textContent = t; };

// ---- stall watch (?SSB64_STALL_WATCH=1) ---------------------------------
// __stalls  : per-hitch records pushed by Module.onStall (engine side).
// __heapLog : 250ms JS-heap samples. setInterval cannot fire while the main
//             thread is blocked, so a gap in this log brackets the freeze —
//             and a sharp usedJSHeapSize DROP across that gap is the
//             signature of a major GC, as opposed to engine work.
// dumpStalls(): console.table of everything, called by hand after a demo.
window.__stalls = [];
window.__heapLog = [];
window.__visLog = [];
// Gamepad-poll instrumentation: Chrome allocates fresh Gamepad/button/axis
// wrapper objects on EVERY navigator.getGamepads() call (per connected pad).
// SDL polls each frame, so connected controllers are a steady per-frame JS
// allocator that no-pad test rigs never see. Count calls + pads so
// dumpStalls can correlate heap growth with polling.
window.__gpStats = { calls: 0, pads: 0 };
window.__slowLoads = [];
if (navigator.getGamepads) {
  const origGP = navigator.getGamepads.bind(navigator);
  navigator.getGamepads = function () {
    const r = origGP();
    window.__gpStats.calls++;
    let n = 0; for (const g of r) if (g) n++;
    window.__gpStats.pads = n;
    return r;
  };
}
if (new URLSearchParams(location.search).get('SSB64_STALL_WATCH') === '1') {
  setInterval(() => {
    const H = window.__heapLog;
    H.push({
      t: Math.round(performance.now()),
      jsMb: performance.memory ? (performance.memory.usedJSHeapSize >> 20) : -1,
      wasmMb: (typeof Module !== 'undefined' && Module.HEAPU8) ? (Module.HEAPU8.byteLength >> 20) : 0,
      // dlmalloc break (high-water) — what INITIAL_MEMORY actually must cover.
      usedMb: (typeof Module !== 'undefined' && Module.calledRun && Module._port_heap_used) ? (Module._port_heap_used() >>> 20) : -1,
      // Chrome clamps setTimeout/setInterval to 1000ms for a tab it considers
      // hidden — which includes NATIVE WINDOW OCCLUSION (another app's window
      // covering the browser, e.g. OBS). The pacer in port.cpp rides
      // emscripten_sleep -> setTimeout, so a clamp drops the game to 1fps and
      // starves the audio queue. Stamping visibility on every sample tells a
      // throttle apart from a GC pause or engine work.
      vis: document.visibilityState[0],   // 'v'isible / 'h'idden
      foc: document.hasFocus() ? 1 : 0,
    });
    if (H.length > 4000) H.shift();
  }, 250);
  // Discrete visibility transitions, so a gap can be attributed even if it
  // straddles two samples.
  document.addEventListener('visibilitychange', () => {
    window.__visLog.push({ t: Math.round(performance.now()), vis: document.visibilityState });
  });
  window.addEventListener('blur',  () => window.__visLog.push({ t: Math.round(performance.now()), vis: 'blur' }));
  window.addEventListener('focus', () => window.__visLog.push({ t: Math.round(performance.now()), vis: 'focus' }));
}
window.dumpStalls = () => {
  console.table(window.__stalls);
  // Sampler gaps > 1s, with the heap delta across each gap.
  const gaps = [];
  for (let i = 1; i < window.__heapLog.length; i++) {
    const a = window.__heapLog[i - 1], b = window.__heapLog[i];
    if (b.t - a.t > 1000) {
      gaps.push({ atMs: a.t, gapMs: b.t - a.t, jsMbBefore: a.jsMb, jsMbAfter: b.jsMb,
                  jsDelta: b.jsMb - a.jsMb, wasmBefore: a.wasmMb, wasmAfter: b.wasmMb });
    }
  }
  console.table(gaps);
  console.table(window.__visLog);
  // Sampler intervals during each gap: a RUN of ~1000ms intervals is Chrome
  // throttling the tab's timers; a single long interval with the rest at
  // 250ms is a real one-shot pause (GC or engine work).
  const clamped = window.__heapLog.filter((s, i, a) => i && a[i].t - a[i-1].t > 900 && a[i].t - a[i-1].t < 1200).length;
  const verdict = clamped > 3 ? 'TIMER THROTTLING (occlusion/hidden tab) — see __visLog'
                : gaps.some(g => g.jsDelta < -50) ? 'GC pause (large JS heap drop across the gap)'
                : gaps.some(g => g.wasmBefore !== g.wasmAfter) ? 'wasm heap growth (ALLOW_MEMORY_GROWTH copy)'
                : window.__stalls.some(s => s.blame === 'wasm') ? 'engine work inside PortPushFrame'
                : window.__stalls.length ? `${window.__stalls.length} brief browser-side hold(s), no heap drop / no throttling — minor GC or scheduler blip`
                : 'no stalls recorded';
  console.log('%c' + verdict, 'font-weight:bold');
  const gp = window.__gpStats, upSec = performance.now()/1000;
  if (window.__slowLoads.length) console.table(window.__slowLoads);
  return { stalls: window.__stalls.length, gaps: gaps.length, clampedIntervals: clamped, verdict,
           gamepadPollsPerSec: +(gp.calls/upSec).toFixed(1), padsConnected: gp.pads,
           slowLoads: window.__slowLoads.length };
};

// ---- controller ports ---------------------------------------------------
// Logical N64 port -> input device. The engine samples this once per game
// tick (Module.readPorts) and treats a port with no device as unplugged, so
// the character select spawns exactly one cursor per real player and
// hot-plug just works (mnPlayersVSUpdateGate). Sources, in priority order:
//   ?ports=<json>      the site's plan, one entry per port:
//                      {kind:'gamepad',id,index} | {kind:'keyboard'} |
//                      {kind:'none'} (explicitly closed) | null (free)
//   (none)             auto: gamepads by index -> ports 1..n; the keyboard
//                      takes a port only when no gamepad has one
// Assignments are sticky for the session: a disconnected pad leaves its
// port unplugged (nobody's fighter changes hands mid-match) and takes it
// back on reconnect; a brand-new pad takes the lowest FREE port (never a
// closed one). apply(plan) swaps in a new plan from Advanced options.
window.controllerPorts = (() => {
  const KIND = { AUTO: 0, NONE: 1, KEYBOARD: 2, GAMEPAD: 3 };
  const BTN = { A: 0x8000, B: 0x4000, Z: 0x2000, START: 0x1000,
                DUP: 0x0800, DDOWN: 0x0400, DLEFT: 0x0200, DRIGHT: 0x0100,
                L: 0x0020, R: 0x0010, CUP: 0x0008, CDOWN: 0x0004, CLEFT: 0x0002, CRIGHT: 0x0001 };
  const STICK_MAX = 80;      // OSContPad stick range
  const STICK_DEADZONE = 0.15;
  const C_STICK_THRESHOLD = 0.5;
  const params = new URLSearchParams(location.search);
  const listeners = new Set();
  let ports = [null, null, null, null];
  let engaged = false;

  const livePads = () => {
    const out = [];
    if (!navigator.getGamepads) return out;
    for (const g of navigator.getGamepads()) if (g && g.connected) out.push(g);
    return out;
  };
  const freePort = () => ports.findIndex((p) => p === null);
  const padEntry = (g) => ({ kind: 'gamepad', id: g.id, index: g.index, lost: false, seen: true });
  const isDevice = (p) => p && p.kind !== 'none';
  const snapshot = () => ports.map((p) => (p ? { kind: p.kind, id: p.id, index: p.index, lost: !!p.lost } : null));
  const notify = () => {
    for (const fn of listeners) { try { fn(snapshot()); } catch (e) { console.warn('controllerPorts listener', e); } }
  };

  // Default rules, matching the site's planControllerPorts
  // (shared/controller-ports.js) with every port on automatic.
  function plan(pads) {
    const next = [null, null, null, null];
    let n = 0;
    for (const g of pads.sort((a, b) => a.index - b.index)) {
      if (n < 4) next[n++] = padEntry(g);
    }
    if (n === 0) next[0] = { kind: 'keyboard' };
    return next;
  }

  function ensureSomeone() {
    if (!ports.some(isDevice)) {
      const slot = Math.max(0, freePort());
      ports[slot] = { kind: 'keyboard' };
    }
  }

  // A plan from the site: keep the live state of pads we already track.
  function adopt(parsed) {
    const live = livePads();
    return [0, 1, 2, 3].map((i) => {
      const e = parsed[i];
      if (!e || typeof e !== 'object') return null;
      if (e.kind === 'keyboard') return { kind: 'keyboard' };
      if (e.kind === 'none') return { kind: 'none' };
      if (e.kind === 'gamepad' && typeof e.id === 'string') {
        const index = Number(e.index) || 0;
        const known = ports.find((p) => p && p.kind === 'gamepad' && p.id === e.id && p.index === index);
        if (known) return known;
        const visible = live.find((g) => g.id === e.id && g.index === index);
        // Not seen by THIS document yet: the browser only exposes a pad
        // to a frame after a button press in it, so trust the plan and
        // let the first gamepadconnected fix up the index.
        return { kind: 'gamepad', id: e.id, index, lost: false, seen: !!visible };
      }
      return null;
    });
  }

  function init() {
    const raw = params.get('ports');
    let parsed = null;
    if (raw) {
      try { parsed = JSON.parse(raw); } catch (e) { console.warn('controllerPorts: bad ?ports=', e); }
    }
    ports = Array.isArray(parsed) ? adopt(parsed) : plan(livePads());
    ensureSomeone();
    engaged = true;
    console.log('controllerPorts:', snapshot());
    notify();
  }

  window.addEventListener('gamepadconnected', (e) => {
    const g = e.gamepad;
    if (!g) return;
    // A planned-but-unseen or lost pad with this id takes its port back
    // (index may differ between the site's window and this frame).
    const mine = ports.find((p) => p && p.kind === 'gamepad' && p.id === g.id &&
                                   (p.lost || !p.seen || p.index === g.index));
    if (mine) {
      mine.index = g.index; mine.lost = false; mine.seen = true;
      notify();
      return;
    }
    const slot = freePort();
    if (slot < 0) return;
    ports[slot] = padEntry(g);
    notify();
  });
  window.addEventListener('gamepaddisconnected', (e) => {
    const g = e.gamepad;
    if (!g) return;
    const mine = ports.find((p) => p && p.kind === 'gamepad' && !p.lost && p.id === g.id && p.index === g.index);
    if (mine) { mine.lost = true; notify(); }
  });

  // Live re-plan from the site's Advanced options while the game runs.
  function apply(parsed) {
    if (!Array.isArray(parsed)) return;
    ports = adopt(parsed);
    ensureSomeone();
    notify();
  }

  // Standard-mapping Gamepad -> N64 pad. Mirrors libultraship's SDL
  // defaults (A/B, LB=L, RT=R, LT=Z, Start, D-pad, right stick=C) plus
  // X/Y=C-up (jump) and RB=R (shield) for comfort.
  function sample(g) {
    const pressed = (i) => { const b = g.buttons[i]; return !!b && (b.pressed || b.value > 0.5); };
    const axis = (i) => { const v = g.axes[i]; return typeof v === 'number' ? v : 0; };
    let button = 0;
    if (pressed(0)) button |= BTN.A;
    if (pressed(1)) button |= BTN.B;
    if (pressed(2) || pressed(3)) button |= BTN.CUP;
    if (pressed(4)) button |= BTN.L;
    if (pressed(5) || pressed(7)) button |= BTN.R;
    if (pressed(6)) button |= BTN.Z;
    if (pressed(9)) button |= BTN.START;
    if (pressed(12)) button |= BTN.DUP;
    if (pressed(13)) button |= BTN.DDOWN;
    if (pressed(14)) button |= BTN.DLEFT;
    if (pressed(15)) button |= BTN.DRIGHT;
    const rx = axis(2), ry = axis(3);
    if (ry < -C_STICK_THRESHOLD) button |= BTN.CUP;
    if (ry > C_STICK_THRESHOLD) button |= BTN.CDOWN;
    if (rx < -C_STICK_THRESHOLD) button |= BTN.CLEFT;
    if (rx > C_STICK_THRESHOLD) button |= BTN.CRIGHT;
    let x = axis(0), y = axis(1);
    const len = Math.hypot(x, y);
    if (len < STICK_DEADZONE) { x = 0; y = 0; }
    else { const s = Math.min(1, (len - STICK_DEADZONE) / (1 - STICK_DEADZONE)) / len; x *= s; y *= s; }
    return { button, sx: Math.round(x * STICK_MAX), sy: Math.round(-y * STICK_MAX) };
  }

  // Engine entry point: fill 4 x {kind, button, stick_x, stick_y} int32s.
  function readPorts(ptr) {
    if (!engaged) return;
    const H = Module.HEAP32;
    if (!H) return;
    const base = ptr >> 2;
    const gps = navigator.getGamepads ? navigator.getGamepads() : [];
    for (let i = 0; i < 4; i++) {
      const p = ports[i];
      let kind = KIND.NONE, button = 0, sx = 0, sy = 0;
      if (p && p.kind === 'keyboard') {
        kind = KIND.KEYBOARD;
      } else if (p && p.kind === 'gamepad' && !p.lost) {
        kind = KIND.GAMEPAD;
        const g = gps[p.index];
        if (g && g.connected && g.id === p.id) ({ button, sx, sy } = sample(g));
      }
      H[base + i * 4] = kind;
      H[base + i * 4 + 1] = button;
      H[base + i * 4 + 2] = sx;
      H[base + i * 4 + 3] = sy;
    }
  }

  init();
  return {
    readPorts,
    snapshot,
    apply,
    subscribe(fn) { listeners.add(fn); return () => listeners.delete(fn); },
  };
})();

// ---- on-demand roster staging ------------------------------------------
// Module.__stageUrls: MEMFS path -> URL, registered by the roster boot path.
// Module.ensureStaged(path): called synchronously from the engine
// (port/staged_file.c) the first time it opens a roster file. Prefer bytes
// prefetched in the background; otherwise a synchronous XHR, because the
// caller is inside an N64-thread fiber and cannot yield. Returns true when
// the file is in MEMFS afterwards.
const stageCache = new Map();

function stageWrite(path, bytes) {
  const dir = path.substring(0, path.lastIndexOf('/')) || '/';
  FS.mkdirTree(dir);
  FS.writeFile(path, bytes);
}

async function stageNow(path) {
  if (FS.analyzePath(path).exists) return true;
  const url = Module.__stageUrls?.[path];
  if (!url) return false;
  const r = await fetch(url);
  if (!r.ok) throw new Error(`fetch ${url}: ${r.status}`);
  stageWrite(path, new Uint8Array(await r.arrayBuffer()));
  return true;
}

function prefetchStaged(paths, concurrency = 3) {
  const queue = paths.filter((p) => Module.__stageUrls?.[p]);
  let active = 0;
  const next = () => {
    while (active < concurrency && queue.length) {
      const path = queue.shift();
      if (FS.analyzePath(path).exists || stageCache.has(path)) continue;
      active++;
      fetch(Module.__stageUrls[path])
        .then(async (r) => {
          if (!r.ok) throw new Error(`${r.status}`);
          stageCache.set(path, new Uint8Array(await r.arrayBuffer()));
        })
        .catch((e) => console.warn(`prefetch ${path} failed:`, e.message))
        .finally(() => { active--; next(); });
    }
  };
  next();
}

function fetchSync(url) {
  const xhr = new XMLHttpRequest();
  xhr.open('GET', url, false);
  // Binary through a synchronous XHR: responseType may not be 'arraybuffer'
  // on the main thread, so read a byte-per-char string instead.
  xhr.overrideMimeType('text/plain; charset=x-user-defined');
  xhr.send(null);
  if (xhr.status !== 200) throw new Error(`${url}: ${xhr.status}`);
  const text = xhr.responseText;
  const bytes = new Uint8Array(text.length);
  for (let i = 0; i < text.length; i++) bytes[i] = text.charCodeAt(i) & 0xff;
  return bytes;
}

window.__stageStats = { cached: 0, sync: 0, syncMs: 0 };
function ensureStaged(path) {
  if (FS.analyzePath(path).exists) return true;
  const url = Module.__stageUrls?.[path];
  if (!url) return false;

// Trailer source capture. The outer site's CRT is deliberately not part of
// this stream: only completed frames from the engine canvas are recorded.
// The dev upload endpoint performs the expensive 2560x1920 constant-60-fps
// finish after recording so encoding cannot steal frames from the game.
window.startTrailerClip = () => {
  if (window.__trailerClipPromise) return window.__trailerClipPromise;

  const fps = 60;
  const stream = Module.canvas.captureStream(fps);
  const videoTrack = stream.getVideoTracks()[0];
  if (videoTrack) videoTrack.contentHint = 'motion';
  // SDL2 is exported on the Emscripten Module, not window. The old lookup
  // silently missed it and produced a video-only WebM.
  const sdl2 = Module.SDL2 || window.SDL2;
  const audioContext = sdl2?.audioContext;
  const audioNode = sdl2?.audio?.scriptProcessorNode;
  let audioDestination = null;
  if (audioContext && audioNode) {
    if (audioContext.state === 'suspended') void audioContext.resume();
    audioDestination = audioContext.createMediaStreamDestination();
    audioNode.connect(audioDestination);
    for (const track of audioDestination.stream.getAudioTracks()) stream.addTrack(track);
  } else {
    for (const track of stream.getTracks()) track.stop();
    return Promise.reject(new Error('SDL game audio output is not ready'));
  }

  const preferredMimeTypes = [
    'video/webm;codecs=vp9,opus',
    'video/webm;codecs=vp8,opus',
    'video/webm',
  ];
  const mimeType = preferredMimeTypes.find((type) => MediaRecorder.isTypeSupported(type));
  const recorder = new MediaRecorder(stream, {
    ...(mimeType ? { mimeType } : {}),
    videoBitsPerSecond: 20_000_000,
    audioBitsPerSecond: 192_000,
  });
  const chunks = [];
  let stopTimer = 0;
  let tutorialTimer = 0;

  window.__trailerClipPromise = new Promise((resolve, reject) => {
    const stop = () => {
      if (recorder.state !== 'inactive') recorder.stop();
    };
    window.stopTrailerClip = stop;
    const onTutorialStart = () => {
      tutorialTimer = setTimeout(stop, 1500);
    };
    window.addEventListener('opensmash:tutorial-start', onTutorialStart, { once: true });
    stopTimer = setTimeout(stop, 5 * 60 * 1000);
    recorder.ondataavailable = (event) => {
      if (event.data.size) chunks.push(event.data);
    };
    recorder.onerror = (event) => reject(event.error || new Error('Trailer recording failed'));
    recorder.onstop = () => {
      clearTimeout(stopTimer);
      clearTimeout(tutorialTimer);
      window.removeEventListener('opensmash:tutorial-start', onTutorialStart);
      if (audioDestination && audioNode) {
        try { audioNode.disconnect(audioDestination); } catch { /* already disconnected */ }
      }
      for (const track of stream.getTracks()) track.stop();
      const blob = new Blob(chunks, { type: recorder.mimeType || 'video/webm' });
      window.stopTrailerClip = null;
      window.__trailerClipPromise = null;
      resolve(blob);
    };
    recorder.start(1000);
  });
  return window.__trailerClipPromise;
};
// pressKey(code, ms): synthetic key hold on the canvas (SDL listens on it).
window.pressKey = (code, ms = 120) => new Promise((resolve) => {
  const t = Module.canvas;
  t.dispatchEvent(new KeyboardEvent('keydown', { code, bubbles: true }));
  setTimeout(() => {
    t.dispatchEvent(new KeyboardEvent('keyup', { code, bubbles: true }));
    resolve();
  }, ms);
});
</script>
<script>
// ---- matchup card ----------------------------------------------------
// Vanilla VS mode has no "A VS B" screen (only 1P Game does), so with a
// generated roster nobody knows who they are fighting. Two ticks into a VS
// battle the engine calls Module.onMatchup(json) and freezes until
// Module._port_matchup_release(); this shows the card in between: portrait,
// name and port tag per fighter, announcer name clips in order, any button
// skips. Skipped entirely for capture / replay harness runs (no handler ->
// the engine never holds, so tick timing stays exact).
(() => {
  const params = new URLSearchParams(location.search);
  // The engine now draws its own VS card (scvsintro.c); this DOM card is
  // kept as an opt-in fallback (?matchup=1).
  if (params.get('matchup') !== '1') return;
  const VANILLA = ['Mario', 'Fox', 'Donkey Kong', 'Samus', 'Luigi', 'Link',
                   'Yoshi', 'Captain Falcon', 'Kirby', 'Pikachu', 'Jigglypuff', 'Ness'];
  const PORT_COLORS = ['#ff4a3d', '#4a7dff', '#ffd23d', '#4ad35a'];
  const TEAM_COLORS = ['#ff4a3d', '#4a7dff', '#4ad35a', '#ffd23d'];
  const MIN_SHOW_MS = 3400;
  const el = document.getElementById('matchup');
  const row = el.querySelector('.row');
  let rosterPromise = null;
  const roster = () => (rosterPromise ||= fetch('/roster.json', { cache: 'no-cache' })
    .then((r) => (r.ok ? r.json() : []))
    .then((list) => new Map(list.map((c) => [c.slug, c])))
    .catch(() => new Map()));
  // Legacy single-inject launches (?inject=bundles/<slug>.osb6&fkind=N)
  // carry no roster binding; recover the slug from the bundle URL.
  const legacySlug = (p) => {
    const inject = params.get('inject');
    if (!inject) return '';
    if (String(p.p) !== (params.get('player') || '0')) return '';
    if (String(p.fkind) !== (params.get('fkind') || '0')) return '';
    const m = inject.match(/([a-z0-9]+)(?:-[a-z]+)?\.osb\d?$/);
    return m ? m[1] : '';
  };
  const slugFromSet = (p) => {
    // ?inject_set=<osb>:<fkind>:<char>,...
    for (const entry of (params.get('inject_set') || '').split(',')) {
      const [, fk, chr] = entry.split(':');
      if (chr && Number(fk) === p.fkind) return chr;
    }
    return '';
  };
  const release = () => { try { Module._port_matchup_release(); } catch (e) { console.warn(e); } };
  let active = null;

  const playClips = (urls, signal) => new Promise((resolve) => {
    let i = 0;
    const next = () => {
      if (signal.aborted || i >= urls.length) return resolve();
      const a = new Audio(urls[i++]);
      a.volume = 0.9;
      a.addEventListener('ended', () => setTimeout(next, 260));
      a.addEventListener('error', next);
      signal.addEventListener('abort', () => { try { a.pause(); } catch (_) {} }, { once: true });
      a.play().catch(next);
    };
    next();
  });

  Module.onMatchup = async (json) => {
    const data = JSON.parse(json);
    const players = (data.players || []).filter((p) => p.kind === 0 || p.kind === 1);
    if (players.length < 2) return release();
    if (active) active.abort();
    const ctl = new AbortController();
    active = ctl;
    const chars = await roster();
    row.innerHTML = '';
    el.classList.toggle('compact', players.length > 2);
    const clips = [];
    players.forEach((p, idx) => {
      const slug = p.slug || legacySlug(p) || slugFromSet(p);
      const c = slug ? chars.get(slug) : null;
      const name = c?.display || c?.name || (slug ? slug : VANILLA[p.fkind] || `Fighter ${p.fkind}`);
      const color = data.team ? TEAM_COLORS[p.team] : (p.kind === 0 ? PORT_COLORS[p.p] : '#cfcfcf');
      const tag = p.kind === 0 ? `${p.p + 1}P` : 'CP';
      if (idx > 0) {
        const vs = document.createElement('div');
        vs.className = 'vs';
        vs.textContent = 'VS';
        row.appendChild(vs);
      }
      const card = document.createElement('div');
      card.className = 'card';
      card.style.setProperty('--pc', color);
      card.style.setProperty('--from', idx === 0 ? '-12vw' : (idx === players.length - 1 ? '12vw' : '0'));
      const art = document.createElement('div');
      art.className = 'art';
      if (slug) {
        // Site route; the bare engine harness has no portraits, so a 404
        // just leaves the plain tile.
        const img = new Image();
        img.onload = () => { art.style.backgroundImage = `url("${img.src}")`; };
        img.src = `/character-assets/${slug}/portrait.png`;
      } else {
        art.classList.add('vanilla');
        art.dataset.initial = name[0];
      }
      const tagEl = document.createElement('div');
      tagEl.className = 'tag';
      tagEl.textContent = tag;
      art.appendChild(tagEl);
      const nameEl = document.createElement('div');
      nameEl.className = 'name';
      nameEl.textContent = name;
      card.appendChild(art);
      card.appendChild(nameEl);
      row.appendChild(card);
      if (slug && (c ? c.voice !== false : true)) clips.push(`bundles/${slug}.wav`);
    });
    el.classList.add('show');
    // Timer, not rAF: a background/throttled tab starves rAF while the
    // engine keeps running on Asyncify sleeps, and the card would never
    // fade in.
    void el.offsetWidth;
    setTimeout(() => { if (active === ctl) el.classList.add('in'); }, 30);
    const started = performance.now();
    const skip = () => ctl.abort();
    const keyHandler = (e) => { if (!e.repeat) skip(); };
    window.addEventListener('keydown', keyHandler);
    el.addEventListener('pointerdown', skip);
    let padTimer = 0;
    const pollPads = () => {
      if (ctl.signal.aborted) return clearInterval(padTimer);
      for (const g of navigator.getGamepads ? navigator.getGamepads() : []) {
        if (g && g.buttons.some((b) => b.pressed)) return skip();
      }
    };
    // Ignore pads for the first moment so the button that confirmed the
    // stage does not also skip the card.
    setTimeout(() => { if (!ctl.signal.aborted) padTimer = setInterval(pollPads, 50); }, 400);
    await Promise.race([
      playClips(clips, ctl.signal).then(() => new Promise((r) => setTimeout(r, 700))),
      new Promise((r) => ctl.signal.addEventListener('abort', r, { once: true })),
    ]);
    if (!ctl.signal.aborted) {
      const remain = MIN_SHOW_MS - (performance.now() - started);
      if (remain > 0) {
        await Promise.race([
          new Promise((r) => setTimeout(r, remain)),
          new Promise((r) => ctl.signal.addEventListener('abort', r, { once: true })),
        ]);
      }
    }
    window.removeEventListener('keydown', keyHandler);
    el.removeEventListener('pointerdown', skip);
    clearInterval(padTimer);
    if (!ctl.signal.aborted) ctl.abort();
    el.classList.remove('in');
    release();
    setTimeout(() => { if (active === ctl) el.classList.remove('show'); }, 260);
    Module.canvas.focus();
  };
})();
</script>
<script>
// Resolve the ROM → archive step BEFORE the engine script is inserted.
// Extraction alone takes ~3.5 s, but overlapped with Chrome tier-compiling
// the 7.5 MB engine wasm it balloons to 40 s+: the compile threads hog every
// core and Torch's own module never leaves baseline code. Serial is far
// cheaper. The site normally prewarms the archive during its launch
// animation, so this usually resolves from the cache in milliseconds.
// preRun awaits the same promise; a rejection surfaces there as a status.
window.__shellUnloading = false;
addEventListener('pagehide', () => { window.__shellUnloading = true; });
addEventListener('beforeunload', () => { window.__shellUnloading = true; });
window.__archivePromise = (async () => {
  const manifest = await (await fetch('manifest.json?v=BUILD_VERSION')).json();
  if (manifest.files.some(f => f.path === '/BattleShip.o2r')) return null;
  const entry = manifest.files.find(f => f.path === '/BattleShip.o2r.recipe');
  const recipe = entry ? (await (await fetch(entry.url)).text()).trim() : 'unknown';
  const { ensureArchive } = await import('./rom-extract.js?v=BUILD_VERSION');
  return ensureArchive({ recipe, version: 'BUILD_VERSION',
    setStatus: (t) => { if (typeof setStatus === 'function') setStatus(t); } });
})();
window.__archivePromise.catch(() => {}).then(() => {
  const script = document.createElement('script');
  script.src = 'BattleShip.js?v=BUILD_VERSION';
  document.body.appendChild(script);
});
</script>
</body>
