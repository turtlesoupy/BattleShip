<title>BattleShip (WASM)</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; height: 100%; overflow: hidden; }
  #wrap { display: flex; align-items: center; justify-content: center; height: 100%; }
  /* Hold the canvas element at 4:3 and letterbox inside the viewport;
   * SDL sizes the GL buffer to match the element, so the game renders at
   * the aspect the element has — a free-size canvas means a stretched game. */
  canvas {
    width: min(100vw, calc(100vh * 4 / 3));
    height: min(100vh, calc(100vw * 3 / 4));
    image-rendering: pixelated;
    outline: none;
  }
  #status {
    position: fixed; left: 12px; bottom: 10px; color: #9f9;
    font: 12px/1.4 ui-monospace, monospace; white-space: pre; pointer-events: none;
  }
  #pad {
    position: fixed; left: 50%; bottom: 8px; transform: translateX(-50%);
    z-index: 10; text-align: center; user-select: none;
    font: 12px/1 ui-monospace, monospace;
  }
  #pad-toggle {
    display: inline-block; padding: 5px 14px; border-radius: 14px;
    background: rgba(0,0,0,0.6); color: #ccc; cursor: pointer;
    border: 1px solid #444;
  }
  #pad-toggle:hover { color: #fff; border-color: #777; }
  #pad-panel {
    margin-bottom: 6px; padding: 8px 10px 4px; border-radius: 10px;
    background: rgba(10,10,10,0.82); border: 1px solid #333;
  }
  #pad-panel svg { display: block; width: 420px; max-width: 80vw; height: auto; }
  #pad.collapsed #pad-panel { display: none; }
  #boot {
    position: fixed; left: 12px; top: 10px; z-index: 10;
    font: 12px/1.5 ui-monospace, monospace; user-select: none;
  }
  #boot-toggle {
    display: inline-block; padding: 5px 14px; border-radius: 14px;
    background: rgba(0,0,0,0.6); color: #ccc; cursor: pointer;
    border: 1px solid #444;
  }
  #boot-toggle:hover { color: #fff; border-color: #777; }
  #boot-panel {
    margin-top: 6px; padding: 12px 14px; border-radius: 10px;
    background: rgba(10,10,10,0.88); border: 1px solid #333;
    display: grid; grid-template-columns: auto auto; gap: 8px 10px;
    align-items: center; color: #ccc;
  }
  #boot.collapsed #boot-panel { display: none; }
  #boot-panel label { color: #8a8f98; text-align: right; }
  #boot-panel select {
    background: #1a1c20; color: #ddd; border: 1px solid #444;
    border-radius: 6px; padding: 4px 6px; font: inherit; min-width: 170px;
  }
  #boot-go {
    grid-column: 1 / -1; margin-top: 4px; padding: 7px 0; border-radius: 8px;
    background: #2c5e3a; color: #dff5e4; border: 1px solid #3f7d50;
    font: inherit; font-weight: 700; cursor: pointer; letter-spacing: .04em;
  }
  #boot-go:hover { background: #357146; }
  #boot-note { grid-column: 1 / -1; color: #6d727c; font-size: 11px; }
</style>
</head>

<script>
// Shared roster helpers. ROSTER_VARIANT: skeleton-variant name per fighter
// kind (index = fkind, '' = the mario-default bundle). rosterBaseFk: which
// fighter a character actually PLAYS as — resolution order:
//   URL ?base=slug:target,slug:target  (ad-hoc experiments)
//   > /roster.json "base"               (explicit metadata or balanced server assignment)
//   > the tile the character sits on    (legacy fallback)
// The tile only decides WHERE the character appears on the select screen;
// the base decides skeleton, moveset and which mesh variant is staged.
window.ROSTER_VARIANT = ['', 'fox', 'donkey', 'samus', 'luigi', 'link',
                         'yoshi', 'captain', 'kirby', 'pikachu', 'purin', 'ness'];
window.rosterBaseFk = (c, tileFk) => {
  const V = window.ROSTER_VARIANT;
  const alias = { mario: '', donkeykong: 'donkey', dk: 'donkey',
                  jigglypuff: 'purin', falcon: 'captain', captainfalcon: 'captain' };
  let name = null;
  for (const kv of (new URLSearchParams(location.search).get('base') || '').split(',')) {
    const [s, t] = kv.split(':');
    if (s === c.slug && t) name = t;
  }
  name = name ?? c.base ?? V[tileFk];
  name = alias[name] ?? name;
  let fk = name === '' ? 0 : V.indexOf(name);
  if (fk < 0) { console.warn(`roster: unknown base '${name}' for ${c.slug}`); fk = tileFk; }
  return fk;
};
// stageable = the character's resolved base variant bundle exists
window.rosterStageable = (c, tileFk) => {
  const fk = window.rosterBaseFk(c, tileFk);
  return fk === 0 || (c.variants || []).includes(window.ROSTER_VARIANT[fk]);
};
</script>
<script>
(() => {
  const FK = { mario:0, fox:1, dk:2, donkey:2, samus:3, luigi:4, link:5,
               yoshi:6, captain:7, kirby:8, pikachu:9, purin:10, jigglypuff:10, ness:11 };
  const FIGHTER_NAMES = ["Mario","Fox","Donkey Kong","Samus","Luigi","Link",
                         "Yoshi","Captain Falcon","Kirby","Pikachu","Jigglypuff","Ness"];
  const charSel = document.getElementById('boot-char');
  const slotSel = document.getElementById('boot-slot');
  const oppSel  = document.getElementById('boot-opp');
  const stageSel = document.getElementById('boot-stage');
  const chars = {};   // name -> { fkind -> bundle file }

  FIGHTER_NAMES.forEach((n, k) => {
    const o = document.createElement('option');
    o.value = k; o.textContent = n;
    oppSel.appendChild(o);
  });
  oppSel.value = '8';

  function fillSlots() {
    const c = chars[charSel.value] || {};
    slotSel.innerHTML = '';
    Object.keys(c).map(Number).sort((a,b)=>a-b).forEach(k => {
      const o = document.createElement('option');
      o.value = k; o.textContent = FIGHTER_NAMES[k];
      slotSel.appendChild(o);
    });
  }

  function fillExtraSlots(i) {
    const cs = document.getElementById('boot-extra' + i);
    const ss = document.getElementById('boot-extra' + i + '-slot');
    const c = chars[cs.value] || {};
    ss.innerHTML = '';
    Object.keys(c).map(Number).sort((a,b)=>a-b).forEach(k => {
      const o = document.createElement('option');
      o.value = k; o.textContent = FIGHTER_NAMES[k];
      ss.appendChild(o);
    });
    ss.style.display = cs.value ? '' : 'none';
  }

  const uiBundles = new Set();
  const voiceBundles = new Set();
  fetch('/bundles.json', { cache: 'no-cache' }).then(r => r.json()).then(files => {
    files.forEach(f => {
      if (f.endsWith('.osbui')) { uiBundles.add(f); return; }
      if (f.endsWith('.wav')) { voiceBundles.add(f); return; }
      const base = f.replace(/\.osb$/, '');
      const dash = base.lastIndexOf('-');
      const suffix = dash >= 0 ? base.slice(dash + 1) : null;
      let name = base, fk = 0;   // no fighter suffix -> a Mario-target bundle
      if (suffix !== null && FK[suffix] !== undefined) {
        name = base.slice(0, dash); fk = FK[suffix];
      }
      (chars[name] = chars[name] || {})[fk] = f;
    });
    Object.keys(chars).sort().forEach(n => {
      const o = document.createElement('option');
      o.value = n; o.textContent = n;
      charSel.appendChild(o);
    });
    // extra-injection rows (demo mode): none by default
    [1, 2].forEach(i => {
      const cs = document.getElementById('boot-extra' + i);
      const none = document.createElement('option');
      none.value = ''; none.textContent = '—';
      cs.appendChild(none);
      Object.keys(chars).sort().forEach(n => {
        const o = document.createElement('option');
        o.value = n; o.textContent = n;
        cs.appendChild(o);
      });
      cs.addEventListener('change', () => fillExtraSlots(i));
      fillExtraSlots(i);
    });
    // preselect whatever this page was booted with
    const q = new URLSearchParams(location.search);
    const inj = (q.get('inject') || '').split('/').pop();
    const boot = (q.get('SSB64_BOOT_BATTLE') || '').split(',');
    for (const [n, slots] of Object.entries(chars)) {
      for (const [k, f] of Object.entries(slots)) {
        if (f === inj) { charSel.value = n; fillSlots(); slotSel.value = k; }
      }
    }
    if (!slotSel.options.length) fillSlots();
    if (boot[1] !== undefined) oppSel.value = boot[1];
    if (boot[2] !== undefined && stageSel.querySelector(`option[value="${boot[2]}"]`)) stageSel.value = boot[2];
  }).catch(() => { document.getElementById('boot-note').textContent = 'bundle list unavailable (dev server not running?)'; });

  charSel.addEventListener('change', fillSlots);
  document.getElementById('boot-go').addEventListener('click', () => {
    const c = chars[charSel.value] || {};
    const fk = slotSel.value;
    const file = c[fk];
    if (!file) return;
    const p = new URLSearchParams();
    p.set('inject', 'bundles/' + file);
    p.set('fkind', fk);
    const ui = charSel.value + '.osbui';
    if (uiBundles.has(ui)) p.set('inject_ui', 'bundles/' + ui);
    const vox = charSel.value + '.wav';
    if (voiceBundles.has(vox)) p.set('inject_voice', 'bundles/' + vox);
    // extra injections -> roster set (dedup by slot, main char's slot wins)
    const extraFks = [];
    {
      const taken = new Set([Number(fk)]);
      const setEnts = [];
      [1, 2].forEach(i => {
        const cs = document.getElementById('boot-extra' + i);
        const ss = document.getElementById('boot-extra' + i + '-slot');
        const ec = chars[cs.value] || {};
        const efk = Number(ss.value);
        if (!cs.value || !ec[efk] || taken.has(efk)) return;
        taken.add(efk);
        extraFks.push(efk);
        setEnts.push(`${ec[efk]}:${efk}:${cs.value}`);
      });
      if (setEnts.length) {
        setEnts.unshift(`${file}:${fk}:${charSel.value}`);
        p.set('inject_set', setEnts.join(','));
      }
    }
    if (document.getElementById('boot-mode').value === 'css') {
      p.set('SSB64_START_SCENE', '16');   // VS character select
      p.set('roster', '1');               // paged roster + search targets
      if (extraFks.length) {
        // demo preset: CPUs pre-placed on the extra injections (+ the
        // vanilla opponent); 1P token stays free so you pick yours live
        p.set('SSB64_BOOT_BATTLE',
              `-1,${oppSel.value},${stageSel.value},1,${extraFks[0]},${extraFks[1] !== undefined ? extraFks[1] : -1}`);
      }
    } else {
      p.set('SSB64_BOOT_BATTLE', `${fk},${oppSel.value},${stageSel.value}`);
    }
    p.set('cb', Date.now());
    location.href = location.pathname + '?' + p.toString();
  });
  try { if (localStorage.getItem('bootOpen') === '1') document.getElementById('boot').classList.remove('collapsed'); } catch (e) {}
})();
</script>

<script>
// Capture runs need readable canvas contents at arbitrary points; SDL
// creates the GL context with preserveDrawingBuffer=false, so patch
// getContext before the engine loads. Gated to ?capture= runs only.
if (new URLSearchParams(location.search).has('capture')) {
  const _gc = HTMLCanvasElement.prototype.getContext;
  HTMLCanvasElement.prototype.getContext = function (type, attrs) {
    if (typeof type === 'string' && type.indexOf('webgl') === 0) {
      attrs = Object.assign({}, attrs || {}, { preserveDrawingBuffer: true });
    }
    return _gc.call(this, type, attrs);
  };
}
</script>
<script>
window.__lastError = null;
window.addEventListener('unhandledrejection', (e) => {
  window.__lastError = (e.reason && e.reason.stack) ? String(e.reason.stack) : String(e.reason);
});
window.addEventListener('error', (e) => {
  if (e.error && e.error.stack) window.__lastError = String(e.error.stack);
});
const statusEl = document.getElementById('status');
const setStatus = (t) => { statusEl.textContent = t; };

// ---- stall watch (?SSB64_STALL_WATCH=1) ---------------------------------
// __stalls  : per-hitch records pushed by Module.onStall (engine side).
// __heapLog : 250ms JS-heap samples. setInterval cannot fire while the main
//             thread is blocked, so a gap in this log brackets the freeze —
//             and a sharp usedJSHeapSize DROP across that gap is the
//             signature of a major GC, as opposed to engine work.
// dumpStalls(): console.table of everything, called by hand after a demo.
window.__stalls = [];
window.__heapLog = [];
window.__visLog = [];
// Gamepad-poll instrumentation: Chrome allocates fresh Gamepad/button/axis
// wrapper objects on EVERY navigator.getGamepads() call (per connected pad).
// SDL polls each frame, so connected controllers are a steady per-frame JS
// allocator that no-pad test rigs never see. Count calls + pads so
// dumpStalls can correlate heap growth with polling.
window.__gpStats = { calls: 0, pads: 0 };
window.__slowLoads = [];
if (navigator.getGamepads) {
  const origGP = navigator.getGamepads.bind(navigator);
  navigator.getGamepads = function () {
    const r = origGP();
    window.__gpStats.calls++;
    let n = 0; for (const g of r) if (g) n++;
    window.__gpStats.pads = n;
    return r;
  };
}
if (new URLSearchParams(location.search).get('SSB64_STALL_WATCH') === '1') {
  setInterval(() => {
    const H = window.__heapLog;
    H.push({
      t: Math.round(performance.now()),
      jsMb: performance.memory ? (performance.memory.usedJSHeapSize >> 20) : -1,
      wasmMb: (typeof Module !== 'undefined' && Module.HEAPU8) ? (Module.HEAPU8.byteLength >> 20) : 0,
      // dlmalloc break (high-water) — what INITIAL_MEMORY actually must cover.
      usedMb: (typeof Module !== 'undefined' && Module.calledRun && Module._port_heap_used) ? (Module._port_heap_used() >>> 20) : -1,
      // Chrome clamps setTimeout/setInterval to 1000ms for a tab it considers
      // hidden — which includes NATIVE WINDOW OCCLUSION (another app's window
      // covering the browser, e.g. OBS). The pacer in port.cpp rides
      // emscripten_sleep -> setTimeout, so a clamp drops the game to 1fps and
      // starves the audio queue. Stamping visibility on every sample tells a
      // throttle apart from a GC pause or engine work.
      vis: document.visibilityState[0],   // 'v'isible / 'h'idden
      foc: document.hasFocus() ? 1 : 0,
    });
    if (H.length > 4000) H.shift();
  }, 250);
  // Discrete visibility transitions, so a gap can be attributed even if it
  // straddles two samples.
  document.addEventListener('visibilitychange', () => {
    window.__visLog.push({ t: Math.round(performance.now()), vis: document.visibilityState });
  });
  window.addEventListener('blur',  () => window.__visLog.push({ t: Math.round(performance.now()), vis: 'blur' }));
  window.addEventListener('focus', () => window.__visLog.push({ t: Math.round(performance.now()), vis: 'focus' }));
}
window.dumpStalls = () => {
  console.table(window.__stalls);
  // Sampler gaps > 1s, with the heap delta across each gap.
  const gaps = [];
  for (let i = 1; i < window.__heapLog.length; i++) {
    const a = window.__heapLog[i - 1], b = window.__heapLog[i];
    if (b.t - a.t > 1000) {
      gaps.push({ atMs: a.t, gapMs: b.t - a.t, jsMbBefore: a.jsMb, jsMbAfter: b.jsMb,
                  jsDelta: b.jsMb - a.jsMb, wasmBefore: a.wasmMb, wasmAfter: b.wasmMb });
    }
  }
  console.table(gaps);
  console.table(window.__visLog);
  // Sampler intervals during each gap: a RUN of ~1000ms intervals is Chrome
  // throttling the tab's timers; a single long interval with the rest at
  // 250ms is a real one-shot pause (GC or engine work).
  const clamped = window.__heapLog.filter((s, i, a) => i && a[i].t - a[i-1].t > 900 && a[i].t - a[i-1].t < 1200).length;
  const verdict = clamped > 3 ? 'TIMER THROTTLING (occlusion/hidden tab) — see __visLog'
                : gaps.some(g => g.jsDelta < -50) ? 'GC pause (large JS heap drop across the gap)'
                : gaps.some(g => g.wasmBefore !== g.wasmAfter) ? 'wasm heap growth (ALLOW_MEMORY_GROWTH copy)'
                : window.__stalls.some(s => s.blame === 'wasm') ? 'engine work inside PortPushFrame'
                : window.__stalls.length ? `${window.__stalls.length} brief browser-side hold(s), no heap drop / no throttling — minor GC or scheduler blip`
                : 'no stalls recorded';
  console.log('%c' + verdict, 'font-weight:bold');
  const gp = window.__gpStats, upSec = performance.now()/1000;
  if (window.__slowLoads.length) console.table(window.__slowLoads);
  return { stalls: window.__stalls.length, gaps: gaps.length, clampedIntervals: clamped, verdict,
           gamepadPollsPerSec: +(gp.calls/upSec).toFixed(1), padsConnected: gp.pads,
           slowLoads: window.__slowLoads.length };
};

var Module = {
  canvas: document.getElementById('canvas'),
  arguments: [],
  preRun: [async function () {
    // MUST be registered synchronously, before any await in this
    // function — an await suspends the async preRun and the runtime
    // proceeds to main() unless a dependency is already pending.
    addRunDependency('battleship-files');
    // ASan builds only (no-op otherwise): report every error and keep
    // running instead of aborting on the first one.
    if (typeof ENV !== 'undefined') {
      ENV.ASAN_OPTIONS = 'halt_on_error=0:detect_container_overflow=0';
    }
    // Dev harness: every SSB64_* query param becomes an environment
    // variable, so the browser build keeps the native hook contract
    // (?SSB64_BOOT_BATTLE=0,8,4 etc). `inject` is the one alias with
    // extra behavior: it names a bundle URL, fetched into MEMFS, and
    // sets SSB64_INJECT_BUNDLE to the staged path.
    const params = new URLSearchParams(location.search);
    for (const [k, v] of params) {
      if (k.startsWith('SSB64_') && typeof ENV !== 'undefined') ENV[k] = v;
    }
    try {
      if (params.has('inject_ui')) {
        const url = params.get('inject_ui');
        const resp = await fetch(url, { cache: 'no-cache' });
        if (!resp.ok) throw new Error(`fetch ${url}: ${resp.status}`);
        FS.writeFile('/inject.osbui', new Uint8Array(await resp.arrayBuffer()));
        if (typeof ENV !== 'undefined') ENV.SSB64_INJECT_UI = '/inject.osbui';
      }
      if (params.has('capture')) {
        // frame-exact capture: the engine calls Module.onGameTick(frame)
        // after every completed game tick; grab the canvas at target ticks
        // and upload. Tick-based, so capture stalls can't desync replays.
        const [cs, ce, cstep] = params.get('capture').split(':').map(Number);
        const capname = params.get('capname') || 'cap';
        const targets = new Set();
        for (let f = cs; f < ce; f += cstep) targets.add(f);
        const total = targets.size;
        const pend = [];
        // Inline capture on the exact tick: valid in ANY tab state because
        // the head script forced preserveDrawingBuffer=true on the GL
        // context for capture runs (otherwise the compositor clears the
        // buffer between tasks and reads come back black in visible tabs;
        // rAF-based reads are no better — rAF never fires in hidden tabs).
        Module.onGameTick = (f) => {
          if (!targets.delete(f)) return;
          const d = Module.canvas.toDataURL('image/png');
          pend.push(fetch('/upload', { method: 'POST', body: d,
            headers: { 'X-Capture-Name': capname + '/frame_' + f + '.png' } }));
          if (targets.size % 25 === 0) setStatus(`capturing ${total - targets.size}/${total}`);
          if (targets.size === 0) {
            Promise.all(pend).then(() => {
              setStatus(`CAPTURE DONE (${total} frames)`);
              document.title = 'CAPTURE-DONE';
            });
          }
        };
      }
      if (params.has('replay')) {
        const url = params.get('replay');
        const resp = await fetch(url, { cache: 'no-cache' });
        if (!resp.ok) throw new Error(`fetch ${url}: ${resp.status}`);
        FS.writeFile('/replay.rpl', new Uint8Array(await resp.arrayBuffer()));
        if (typeof ENV !== 'undefined') ENV.SSB64_REPLAY_PLAY = '/replay.rpl';
      }
      if (params.has('inject_voice')) {
        const url = params.get('inject_voice');
        const resp = await fetch(url, { cache: 'no-cache' });
        if (!resp.ok) throw new Error(`fetch ${url}: ${resp.status}`);
        FS.writeFile('/inject-voice.wav', new Uint8Array(await resp.arrayBuffer()));
        if (typeof ENV !== 'undefined') ENV.SSB64_INJECT_VOICE = '/inject-voice.wav';
      }
      if (params.has('inject')) {
        const url = params.get('inject');
        const resp = await fetch(url, { cache: 'no-cache' });
        if (!resp.ok) throw new Error(`fetch ${url}: ${resp.status}`);
        FS.writeFile('/inject.osb', new Uint8Array(await resp.arrayBuffer()));
        if (typeof ENV !== 'undefined') {
          ENV.SSB64_INJECT_BUNDLE = '/inject.osb';
          ENV.SSB64_INJECT_FKIND = params.get('fkind') || '0';
          // default player 0: in mirror matches (eval runs) BOTH fighters
          // share the inject fkind, and an unpinned attach lets P2 steal
          // ownership, leaving P1 blanked and invisible.
          ENV.SSB64_INJECT_PLAYER = params.get('player') || '0';
        }
      }
      // Roster injection (demo mode): inject_set=<osbfile>:<fkind>:<char>,...
      // Each entry pulls bundles/<osbfile> plus that character's .osbui and
      // announcer .wav when staged (missing extras are skipped silently).
      if (params.has('inject_set')) {
        const set = [], uiset = [], vset = [];
        await Promise.all(params.get('inject_set').split(',').map(async (ent) => {
          const [file, fk, chr] = ent.split(':');
          if (!file || fk === undefined) return;
          const r = await fetch('bundles/' + file, { cache: 'no-cache' });
          if (!r.ok) throw new Error(`fetch bundles/${file}: ${r.status}`);
          FS.writeFile(`/inject_fk${fk}.osb`, new Uint8Array(await r.arrayBuffer()));
          set.push(`/inject_fk${fk}.osb:${fk}`);
          if (chr) {
            const ui = await fetch(`bundles/${chr}.osbui`, { cache: 'no-cache' });
            if (ui.ok) {
              FS.writeFile(`/inject_fk${fk}.osbui`, new Uint8Array(await ui.arrayBuffer()));
              uiset.push(`/inject_fk${fk}.osbui:${fk}`);
            }
            const wav = await fetch(`bundles/${chr}.wav`, { cache: 'no-cache' });
            if (wav.ok) {
              FS.writeFile(`/inject_fk${fk}.wav`, new Uint8Array(await wav.arrayBuffer()));
              vset.push(`/inject_fk${fk}.wav:${fk}`);
            }
          }
        }));
        if (typeof ENV !== 'undefined' && set.length) {
          ENV.SSB64_INJECT_SET = set.join(',');
          if (uiset.length) ENV.SSB64_INJECT_UI_SET = uiset.join(',');
          if (vset.length) ENV.SSB64_INJECT_VOICE_SET = vset.join(',');
        }
      }
      // Scalable roster (?roster=1): stage every character into MEMFS and
      // write /roster.txt for the engine's paged character select. Each
      // character sits on tile i%12 of page 1+i/12 and ships the mesh
      // variant conformed to that tile's skeleton. (At 1000+ characters
      // the bundles move to on-demand fetch; portraits stay tiny.)
      if (params.has('roster')) {
        try {
          const VARIANT = window.ROSTER_VARIANT;
          const roster = await (await fetch('/roster.json', { cache: 'no-cache' })).json();
          FS.mkdirTree('/roster');
          const lines = [];
          const jobs = [];
          let tile = 0;
          for (const c of roster) {
            const fk = tile % 12;
            if (!window.rosterStageable(c, fk)) {
              console.warn(`roster: ${c.slug} missing its base variant — skipped`);
              continue;
            }
            // the staged mesh targets the BASE fighter's skeleton, which
            // may differ from the tile the character sits on
            const baseFk = window.rosterBaseFk(c, fk);
            const file = baseFk === 0 ? `${c.slug}.osb` : `${c.slug}-${VARIANT[baseFk]}.osb`;
            tile++;
            const ui = c.ui ? `/roster/${c.slug}.osbui` : '';
            const vox = c.voice ? `/roster/${c.slug}.wav` : '';
            lines.push(`${c.slug}|${fk}|/roster/${c.slug}.osb|${ui}|${vox}|${c.short || ''}|${baseFk}`);
            jobs.push((async () => {
              const r = await fetch('bundles/' + file, { cache: 'no-cache' });
              if (!r.ok) throw new Error(`fetch bundles/${file}: ${r.status}`);
              FS.writeFile(`/roster/${c.slug}.osb`, new Uint8Array(await r.arrayBuffer()));
              if (c.ui) {
                const u = await fetch(`bundles/${c.slug}.osbui`, { cache: 'no-cache' });
                if (u.ok) FS.writeFile(`/roster/${c.slug}.osbui`, new Uint8Array(await u.arrayBuffer()));
              }
              if (c.voice) {
                const w = await fetch(`bundles/${c.slug}.wav`, { cache: 'no-cache' });
                if (w.ok) FS.writeFile(`/roster/${c.slug}.wav`, new Uint8Array(await w.arrayBuffer()));
              }
            })());
          }
          await Promise.all(jobs);
          FS.writeFile('/roster.txt', lines.join('\n') + '\n');
          console.log(`roster: staged ${lines.length} characters`);
        } catch (e) {
          console.warn('roster staging failed:', e);
        }
      }
      const manifest = await (await fetch('manifest.json')).json();
      let done = 0;
      await Promise.all(manifest.files.map(async (f) => {
        const resp = await fetch(f.url);
        if (!resp.ok) throw new Error(`fetch ${f.url}: ${resp.status}`);
        const data = new Uint8Array(await resp.arrayBuffer());
        // Ensure parent directories exist, then write the file.
        const dir = f.path.substring(0, f.path.lastIndexOf('/')) || '/';
        FS.mkdirTree(dir);
        FS.writeFile(f.path, data);
        setStatus(`files ${++done}/${manifest.files.length}`);
      }));
      setStatus('starting…');
    } catch (e) {
      setStatus('asset load failed: ' + e.message);
      throw e;
    } finally {
      removeRunDependency('battleship-files');
    }
  }],
  onRuntimeInitialized: function () {
    // INVOKE_RUN=0: start the game ourselves once the FS is staged.
    console.warn('[shell] onRuntimeInitialized: o2r exists =',
      FS.analyzePath('/BattleShip.o2r').exists, 'f3d =', FS.analyzePath('/f3d.o2r').exists);
    setStatus('');
    Module.callMain(Module.arguments);
    console.warn('[shell] callMain returned');
  },
  // Stall attributor sink (?SSB64_STALL_WATCH=1). The engine calls this
  // only for frames whose wall time exceeded 250ms. Records go to a ring
  // buffer, NOT the console: a console.log burst is itself one of the
  // candidate causes, so printing here would corrupt the measurement.
  onStall: function (frame, workMs, reqMs, sleptMs, heapMb) {
    const S = window.__stalls;
    const overshoot = sleptMs - reqMs;
    S.push({
      t: Math.round(performance.now()),
      frame, workMs, reqMs, sleptMs, heapMb,
      wasmMb: Module.HEAPU8 ? (Module.HEAPU8.byteLength >> 20) : 0,
      jsMb: (performance.memory ? (performance.memory.usedJSHeapSize >> 20) : -1),
      // Which side of the yield ate the time.
      blame: workMs >= overshoot ? 'wasm' : 'browser',
    });
    if (S.length > 500) S.shift();
  },
  print: (t) => console.log(t),
  printErr: (t) => {
    // Timestamp slow-inline-load reports so dumpStalls can correlate them
    // with stall records (both use performance.now()-based t).
    if (typeof t === 'string' && t.includes('slow inline')) {
      window.__slowLoads.push({ t: Math.round(performance.now()), msg: t });
      if (window.__slowLoads.length > 200) window.__slowLoads.shift();
    }
    console.warn(t);
  },
  // Lets captureFrame() read back the last presented frame.
  webglContextAttributes: { preserveDrawingBuffer: true },
};

// ---- dev capture helpers ------------------------------------------------
// captureFrame(): PNG data-URL of the current canvas.
// startClip(ms): records a WebM of the canvas, resolves to an object URL.
window.captureFrame = () => Module.canvas.toDataURL('image/png');
window.startClip = (ms = 3000, fps = 30) => new Promise((resolve, reject) => {
  const stream = Module.canvas.captureStream(fps);
  const rec = new MediaRecorder(stream, { mimeType: 'video/webm' });
  const chunks = [];
  rec.ondataavailable = (e) => chunks.push(e.data);
  rec.onstop = () => resolve(URL.createObjectURL(new Blob(chunks, { type: 'video/webm' })));
  rec.onerror = reject;
  rec.start();
  setTimeout(() => rec.stop(), ms);
});
// pressKey(code, ms): synthetic key hold on the canvas (SDL listens on it).
window.pressKey = (code, ms = 120) => new Promise((resolve) => {
  const t = Module.canvas;
  t.dispatchEvent(new KeyboardEvent('keydown', { code, bubbles: true }));
  setTimeout(() => {
    t.dispatchEvent(new KeyboardEvent('keyup', { code, bubbles: true }));
    resolve();
  }, ms);
});
</script>
<script src="BattleShip.js?v=BUILD_VERSION"></script>
</body>
